services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WINVERO_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: ${WINVERO_NODE_ENV:-development}
      GAME_SERVER_PORT: "3002"
      WINVERO_ORIGIN: ${WINVERO_ORIGIN:-http://localhost:8080}
      WINVERO_DATABASE_PATH: /data/winvero.sqlite
      WINVERO_SESSION_TTL_SECONDS: ${WINVERO_SESSION_TTL_SECONDS:-604800}
      WINVERO_TEST_CREDITS_ENABLED: ${WINVERO_TEST_CREDITS_ENABLED:-true}
      WINVERO_TRUST_PROXY: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
    volumes:
      - winvero_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  bot:
    build:
      context: .
      target: bot
    environment:
      NODE_ENV: ${WINVERO_NODE_ENV:-development}
      PORT: "3001"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      WINVERO_PUBLIC_URL: ${WINVERO_PUBLIC_URL:-http://localhost:8080}
      WINVERO_API_URL: http://api:3002
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure:3

volumes:
  winvero_data:
